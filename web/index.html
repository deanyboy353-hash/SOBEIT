<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Quest</title>
<meta name="theme-color" content="#fbf8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var t=JSON.parse(localStorage.getItem('lq-theme')||'"light"');document.documentElement.dataset.theme=t;var a=JSON.parse(localStorage.getItem('lq-accent')||'""');if(a)document.documentElement.dataset.accent=a;}catch(e){}</script>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--SHELL-->
<main>
  <section class="tab" id="tab-home" hidden></section>
  <section class="tab" id="tab-chores" hidden></section>
  <section class="tab" id="tab-play" hidden></section>
  <section class="tab" id="tab-train" hidden></section>
  <section class="tab" id="tab-food" hidden></section>
  <section class="tab" id="tab-health" hidden></section>
  <section class="tab" id="tab-you" hidden></section>
  <section class="tab" id="tab-custom" hidden></section>
  <section class="tab" id="tab-empire" hidden></section>
</main>
<nav class="tabs" id="nav" aria-label="Sections">
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Home</button>
  <button type="button" data-tab="chores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10M4 6l1.2 1.2L7.5 5M4 12l1.2 1.2L7.5 11M4 18l1.2 1.2L7.5 17"/></svg>Chores<span class="dot" id="dotChores"></span></button>
  <button type="button" data-tab="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>Play</button>
  <button type="button" data-tab="train" data-me><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Train<span class="dot" id="dotTrain"></span></button>
  <button type="button" data-tab="food" data-me><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-1.7 1.3-2.5 3.5-2.5 6.5V13H17v8"/></svg>Food</button>
  <button type="button" data-tab="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Health</button>
</nav>
<div class="sheetbg" id="sheetbg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<!--/SHELL-->
<script src="config.js"></script>
<script src="music.js"></script>
<script src="portraits.js"></script>
<script src="djset.js"></script>
<script src="app.js"></script>
</body>
</html>
