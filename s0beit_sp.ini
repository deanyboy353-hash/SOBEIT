; s0beit sp - single-player trainer for gta_sa.exe v1.0 US
; Lines starting with ; are comments.
;
; Key names: insert delete home end pageup pagedown backspace enter space tab escape
;            up down left right lshift rshift lctrl rctrl lalt ralt shift ctrl alt
;            f1..f12 num0..num9 add subtract multiply divide decimal
;            single letters/digits (a-z, 0-9) or a hex virtual-key code (0x2D)

[keys]
menu             = insert
airbreak         = rshift
godmode          = delete
marker_teleport  = home
vehicle_repair   = end
vehicle_unflip   = pagedown
vehicle_boost    = lalt       ; hold
vehicle_brake    = backspace  ; hold
hud              = f11

airbreak_forward = w
airbreak_back    = s
airbreak_left    = a
airbreak_right   = d
airbreak_up      = space
airbreak_down    = lctrl
airbreak_fast    = lshift     ; hold for faster airbreak

[settings]
airbreak_speed     = 25       ; units per second
airbreak_fast_mult = 4
boost_factor       = 1.5      ; speed multiplier per second while boost is held
boost_max          = 4.0      ; ~720 km/h
hud                = 1        ; top status bar
start_godmode      = 0
menu_x             = 20
menu_y             = 180
font_face          = Tahoma
font_size          = 14

; name = x, y, z, interior
