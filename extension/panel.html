<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Nudge</title>
<style>
  html, body { margin: 0; height: 100%; font: 15px system-ui, sans-serif; background: #fbf8fb; color: #1f1a24; }
  #root { height: 100%; }
  iframe { border: 0; position: fixed; left: 0; right: 0; bottom: 0; top: 34px; width: 100%; height: calc(100vh - 34px); display: block; }
  .top { position: fixed; top: 0; left: 0; right: 0; height: 34px; box-sizing: border-box; align-items: center; }
  .top .v { margin-right: auto; color: #a596b8; font-size: 11px; }
  .top { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 4px 8px; background: #120d18; }
  .top button { width: auto; padding: 4px 10px; font-size: 12px; border-radius: 8px; background: rgba(255,255,255,.12); }
  .setup { padding: 22px; }
  .setup h1 { font-size: 22px; margin: 0 0 8px; }
  .setup p { color: #776d82; line-height: 1.45; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #e5dbe8; border-radius: 12px; font: inherit; margin: 6px 0 10px; }
  button { background: #5b44b8; color: #fff; border: 0; border-radius: 12px; padding: 12px 16px; font: 600 15px system-ui; cursor: pointer; width: 100%; }
  .err { color: #b8325c; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="panel.js"></script>
</body>
</html>
