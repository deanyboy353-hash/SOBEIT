<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a0f4a"/><stop offset=".55" stop-color="#140726"/><stop offset="1" stop-color="#07030f"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3fb4"/><stop offset=".55" stop-color="#d14bff"/><stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- laser floor lines -->
  <g stroke="#ff3fb4" stroke-opacity=".16" stroke-width="3">
    <line x1="256" y1="300" x2="-40" y2="560"/><line x1="256" y1="300" x2="130" y2="560"/>
    <line x1="256" y1="300" x2="382" y2="560"/><line x1="256" y1="300" x2="552" y2="560"/>
  </g>
  <g id="mark" transform="translate(256 264) scale(SCALE) translate(-256 -264)">
  <!-- the n -->
  <path d="M156 372 V156 M156 236 C162 186 204 156 258 156 C318 156 352 192 352 252 V372" fill="none" stroke="url(#neon)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M156 372 V156 M156 236 C162 186 204 156 258 156 C318 156 352 192 352 252 V372" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="12" stroke-linecap="round"/>
  <!-- the nudge: a spark being pushed off the shoulder -->
  <circle cx="404" cy="140" r="30" fill="#7ff9ff" filter="url(#glow)"/>
  <circle cx="404" cy="140" r="13" fill="#fff"/>
  </g>
</svg>
