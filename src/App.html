<style>
/* Life Quest: calm, clean, pink and lilac accents. */
:root {
  color-scheme: light;
  --bg: #fbf8fb; --surface: #ffffff; --raised: #f6f1f7; --ink: #1f1a24; --muted: #776d82; --faint: #a79eb0; --line: #eee5ef;
  --lilac: #5b44b8; --lilac-soft: #efeafe; --lilac-mid: #cbbcf6;
  --pink: #b03a6e; --pink-soft: #fdeaf2; --pink-mid: #f3b8cf;
  --good: #23855a; --good-soft: #e3f4ea; --warn: #b8325c; --amber: #8a5a00; --amber-soft: #fff4dc;
  --tile-g: #4f9e72; --tile-y: #d6a531; --tile-b: #8d8496;
  --ring-a: #f3a9c8; --ring-b: #a891ef;
  --radius: 18px; --shadow: 0 1px 2px rgba(31, 26, 36, .04), 0 8px 24px rgba(91, 68, 184, .06);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141118; --surface: #1d1922; --raised: #26212d; --ink: #f4eff7; --muted: #a99fb4; --faint: #776d82; --line: #2f2937;
  --lilac: #c4b4ff; --lilac-soft: #2a2340; --lilac-mid: #4b3d80;
  --pink: #ffadd0; --pink-soft: #3a2331; --pink-mid: #7a3d5a;
  --good: #7ed6a5; --good-soft: #1d3428; --warn: #ff8fb1; --amber: #ffd37a; --amber-soft: #3a2d0d;
  --tile-g: #4a9a6d; --tile-y: #c4962a; --tile-b: #4a4352;
  --shadow: none;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    color-scheme: dark;
    --bg: #141118; --surface: #1d1922; --raised: #26212d; --ink: #f4eff7; --muted: #a99fb4; --faint: #776d82; --line: #2f2937;
    --lilac: #c4b4ff; --lilac-soft: #2a2340; --lilac-mid: #4b3d80;
    --pink: #ffadd0; --pink-soft: #3a2331; --pink-mid: #7a3d5a;
    --good: #7ed6a5; --good-soft: #1d3428; --warn: #ff8fb1; --amber: #ffd37a; --amber-soft: #3a2d0d;
    --tile-g: #4a9a6d; --tile-y: #c4962a; --tile-b: #4a4352;
    --shadow: none;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
body.timesup { background: var(--amber-soft); }
main { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom)); }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
svg.i.s { width: 16px; height: 16px; }
svg.i.l { width: 24px; height: 24px; }

/* type */
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
h3 { font-size: 16px; font-weight: 650; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.right { text-align: right; }

/* layout */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 2px 16px; }
.top .sub { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.tint { background: var(--lilac-soft); border-color: transparent; box-shadow: none; }
.card.blush { background: var(--pink-soft); border-color: transparent; box-shadow: none; }
.card .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }

/* controls */
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; border-radius: 14px; }
button:disabled { opacity: .45; cursor: default; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; font-weight: 600; font-size: 15px; white-space: nowrap; }
.btn.primary { background: var(--lilac); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #17112b; }
@media (prefers-color-scheme: dark) { :root[data-theme="auto"] .btn.primary { color: #17112b; } }
.btn.soft { background: var(--lilac-soft); color: var(--lilac); }
.btn.blush { background: var(--pink-soft); color: var(--pink); }
.btn.ghost { color: var(--lilac); padding: 8px 6px; }
.btn.line { border: 1px solid var(--line); background: var(--surface); }
.btn.wide { width: 100%; }
.btn.big { padding: 16px; font-size: 16.5px; border-radius: 16px; }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 12px; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--raised); color: var(--ink); }
.iconbtn.soft { background: var(--lilac-soft); color: var(--lilac); }
input[type=text], input[type=password], input[type=number], textarea, select {
  width: 100%; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--lilac-mid); }
textarea { min-height: 96px; resize: vertical; }
form.inline { display: flex; gap: 8px; }
.seg { display: flex; background: var(--raised); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 14px; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 11px; font-weight: 600; font-size: 14.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--raised); color: var(--muted); }
.chip.lilac { background: var(--lilac-soft); color: var(--lilac); }
.chip.pink { background: var(--pink-soft); color: var(--pink); }
.chip.good { background: var(--good-soft); color: var(--good); }
button.chip[aria-pressed="true"] { background: var(--lilac); color: #fff; }

/* progress */
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: linear-gradient(90deg, var(--ring-a), var(--ring-b)); transition: width .3s; }
.bar.over > i { background: var(--warn); }
.bar .zone { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); opacity: .25; }
.ring { position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }

/* lists */
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 2px; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .m { font-size: 13px; color: var(--muted); }
.item.done .t { color: var(--faint); text-decoration: line-through; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--lilac-mid); display: grid; place-items: center; flex: none; padding: 0; color: transparent; transition: background .15s; }
.check svg { width: 15px; height: 15px; stroke-width: 2.6; }
.item.done .check, .check.on { background: var(--lilac); border-color: var(--lilac); color: #fff; }
.empty { color: var(--muted); padding: 4px 0; font-size: 15px; }

/* home */
.hero { display: flex; gap: 16px; align-items: center; }
.stat { display: flex; justify-content: space-between; font-size: 14.5px; padding: 3px 0; }
.stat b { font-variant-numeric: tabular-nums; font-weight: 650; }
.brief { font-size: 15.5px; line-height: 1.5; }
.askbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); width: 100%; text-align: left; margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.tile .k { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.drops { display: flex; gap: 4px; }
.drops i { width: 12px; height: 16px; border-radius: 6px 6px 6px 6px / 9px 9px 6px 6px; background: var(--raised); display: block; }
.drops i.on { background: var(--lilac-mid); }

/* timer */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person { background: var(--raised); border-radius: 14px; padding: 12px; min-width: 0; }
.person .st { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.person .dn { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.focus { text-align: center; }
.focus .ring { width: 210px; height: 210px; margin: 6px auto 12px; }
.focus .time { font-size: 46px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.now { background: var(--raised); border-radius: 16px; padding: 14px; margin: 6px 0 12px; text-align: left; }
.steps { list-style: none; padding: 0; margin: 0 0 12px; text-align: left; }
.steps li { display: flex; gap: 10px; align-items: center; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 15px; cursor: pointer; }
.steps li:first-child { border-top: 0; }
.steps li.done { color: var(--faint); text-decoration: line-through; }
.steps li.cur { font-weight: 650; }
.alert { border: 1.5px solid var(--amber); color: var(--amber); background: var(--amber-soft); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; }
.note { background: var(--lilac-soft); color: var(--lilac); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; font-size: 15px; }

/* schedule */
.sched .item .day { min-width: 74px; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days button { padding: 10px 0; border-radius: 12px; background: var(--raised); font-weight: 600; font-size: 13.5px; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--lilac); color: #fff; }
.dates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.dates button { padding: 8px 0; border-radius: 10px; background: var(--raised); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.dates button[aria-pressed="true"] { background: var(--lilac); color: #fff; }
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }

/* games */
.board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; width: min(320px, 100%); margin: 4px auto 14px; }
.board .r { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.board .c { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 10px; display: grid; place-items: center; font-size: 26px; font-weight: 700; text-transform: uppercase; background: var(--surface); }
.board .c.full { border-color: var(--faint); }
.board .c.g, .board .c.y, .board .c.b { color: #fff; border-color: transparent; }
.c.g { background: var(--tile-g) !important; } .c.y { background: var(--tile-y) !important; } .c.b { background: var(--tile-b) !important; }
.board .r.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.mini { display: grid; grid-template-rows: repeat(6, 9px); gap: 3px; }
.mini .r { display: grid; grid-template-columns: repeat(5, 9px); gap: 3px; }
.mini .c { border-radius: 2px; background: var(--raised); }
.keys { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
.keys .kr { display: flex; gap: 5px; justify-content: center; }
.keys button { flex: 1; max-width: 42px; height: 52px; border-radius: 10px; background: var(--raised); font-weight: 650; font-size: 15px; text-transform: uppercase; }
.keys button.wide { max-width: 66px; flex: 1.5; font-size: 12.5px; }
.keys button.g { background: var(--tile-g); color: #fff; } .keys button.y { background: var(--tile-y); color: #fff; } .keys button.b { background: var(--tile-b); color: #fff; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.nums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.nums button { padding: 13px 0; border-radius: 12px; background: var(--lilac-soft); color: var(--lilac); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.nums button.used { opacity: .3; }
.expr { min-height: 52px; border-radius: 14px; background: var(--raised); padding: 12px 14px; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: .02em; margin: 10px 0; }
.ops { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.ops button { padding: 12px 0; border-radius: 12px; background: var(--raised); font-weight: 700; font-size: 18px; }
.pads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(300px, 100%); margin: 10px auto; }
.pads button { aspect-ratio: 1; border-radius: 18px; background: var(--raised); transition: background .12s, transform .12s; }
.pads button.lit { background: linear-gradient(135deg, var(--ring-a), var(--ring-b)); transform: scale(.96); }
.dist .r { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
.dist i { display: block; height: 16px; border-radius: 4px; background: var(--lilac-mid); min-width: 4px; color: var(--ink); font-style: normal; font-size: 11.5px; padding: 0 6px; text-align: right; line-height: 16px; }

/* train */
.set { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.set:first-child { border-top: 0; }
.set .n { width: 18px; color: var(--faint); font-size: 12.5px; text-align: center; flex: none; }
.set .w { flex: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.set.done .w { color: var(--faint); }
.set input[type=number] { width: 76px; flex: none; padding: 8px; text-align: center; }
.stepper { display: flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 32px; height: 32px; background: var(--raised); border-radius: 10px; font-weight: 700; }
.stepper span { min-width: 24px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.amrap { color: var(--pink); font-weight: 700; }
.rest { position: sticky; top: calc(8px + env(safe-area-inset-top)); z-index: 3; display: flex; justify-content: space-between; align-items: center; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; font-weight: 600; }
.rest b { font-size: 22px; font-variant-numeric: tabular-nums; }
.rest button { background: rgba(255, 255, 255, .16); color: inherit; padding: 7px 12px; border-radius: 10px; }
.spark { width: 100%; height: 44px; display: block; }
.vol { display: flex; align-items: flex-end; gap: 6px; height: 72px; margin-top: 8px; }
.vol div { flex: 1; background: var(--lilac-mid); border-radius: 5px 5px 2px 2px; min-height: 3px; }

/* food */
.big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.of { color: var(--muted); font-size: 15px; }
.left { font-weight: 650; font-size: 14.5px; text-align: right; }
.left.good { color: var(--good); } .left.warn { color: var(--warn); }
.preset { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-align: left; padding: 13px; min-height: 74px; display: flex; flex-direction: column; justify-content: space-between; font-weight: 600; }
.preset small { font-weight: 500; color: var(--muted); font-size: 13px; }
.preset:active, .check:active, .tile:active { transform: scale(.97); }
.entries .item { padding: 9px 0; }
.entries .tm { color: var(--faint); width: 42px; flex: none; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.entries .v { color: var(--muted); white-space: nowrap; font-size: 14px; font-variant-numeric: tabular-nums; }
.entries .pending { opacity: .5; }

/* you */
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.badge { border-radius: 14px; background: var(--lilac-soft); color: var(--lilac); padding: 12px 4px 10px; text-align: center; font-size: 11.5px; font-weight: 650; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.badge.locked { background: var(--raised); color: var(--faint); }
.score { display: grid; grid-template-columns: 76px 1fr 44px; gap: 10px; align-items: center; margin: 6px 0; font-size: 14.5px; }
.chat { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.msg { max-width: 86%; padding: 10px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: var(--lilac); color: #fff; border-bottom-right-radius: 6px; }
.msg.ai { align-self: flex-start; background: var(--raised); border-bottom-left-radius: 6px; }
.msg.done { align-self: flex-start; background: var(--good-soft); color: var(--good); font-size: 13.5px; }

/* nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
nav.tabs button { flex: 1; max-width: 104px; padding: 6px 2px 4px; color: var(--faint); font-size: 11.5px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; border-radius: 12px; }
nav.tabs button svg { width: 23px; height: 23px; }
nav.tabs button[aria-current="page"] { color: var(--lilac); }
nav.tabs .dot { position: absolute; top: 0; left: 50%; transform: translateX(10px); background: var(--pink); color: #fff; font-size: 10px; font-weight: 700; border-radius: 8px; padding: 1px 5px; font-variant-numeric: tabular-nums; }
nav.tabs .dot:empty { display: none; }

/* sheet, toast, confetti */
.sheetbg { position: fixed; inset: 0; z-index: 8; background: rgba(20, 17, 24, .38); display: flex; align-items: flex-end; justify-content: center; }
.sheetbg[hidden] { display: none; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 16px calc(22px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(82px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; z-index: 9; background: var(--ink); color: var(--bg); padding: 13px 16px; border-radius: 14px; font-size: 15px; transform: translateY(170%); transition: transform .2s; }
#toast:not(.show) { visibility: hidden; }
#toast.show { transform: none; }
#toast.err { background: var(--warn); color: #fff; }
body.sheetopen #toast { top: calc(12px + env(safe-area-inset-top)); bottom: auto; transform: translateY(-170%); }
body.sheetopen #toast.show { transform: none; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
section.tab[hidden], .hidden { display: none !important; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }

/* Rave: near black with neon pink and violet */
:root[data-theme="rave"] {
  color-scheme: dark;
  --bg: #0a0710; --surface: #130d1b; --raised: #1d1528; --ink: #f8f1ff; --muted: #b2a2c8; --faint: #7a6b90; --line: #2a1f39;
  --lilac: #b693ff; --lilac-soft: #241840; --lilac-mid: #5b3e9c;
  --pink: #ff5fb2; --pink-soft: #3a1431; --pink-mid: #8c2c63;
  --good: #5ff2b0; --good-soft: #10301f; --warn: #ff6b9d; --amber: #ffd36b; --amber-soft: #33270a;
  --tile-g: #36b37a; --tile-y: #d9a12a; --tile-b: #3a3047;
  --ring-a: #ff5fb2; --ring-b: #8f6bff;
  --shadow: 0 10px 30px rgba(143, 107, 255, .10);
}
:root[data-theme="rave"] body { background: radial-gradient(900px 520px at 0% -10%, rgba(255, 95, 178, .13), transparent 60%), radial-gradient(800px 480px at 110% 0%, rgba(143, 107, 255, .16), transparent 60%), var(--bg); background-attachment: fixed; }
:root[data-theme="rave"] .btn.primary { color: #12091f; background: linear-gradient(135deg, #ff7cc2, #a98bff); box-shadow: 0 0 22px rgba(182, 147, 255, .35); }
:root[data-theme="rave"] .card { border-color: #2a1f39; }

.seg button { font-size: 14px; padding: 9px 4px; }
.getapp { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 16px; background: var(--lilac-soft); color: var(--ink); text-decoration: none; margin-bottom: 12px; }

/* double XP */
.boost { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 14px; margin-bottom: 12px; color: #fff; font-size: 14.5px;
  background: linear-gradient(110deg, #e0679f, #8a6be0, #e0679f); background-size: 200% 100%; animation: shimmer 4s linear infinite; }

@keyframes shimmer { to { background-position: -200% 0; } }

/* challenges */
.chest { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--raised); color: var(--muted); font-size: 13.5px; font-weight: 600; }

span.check { cursor: default; }

/* make something */
.tile.make { align-items: center; text-align: center; gap: 4px; padding: 14px 6px; }
.tile.make svg { width: 24px; height: 24px; color: var(--pink); margin-bottom: 4px; }

/* Us */
.card.us .ushead { width: 100%; padding: 0; color: var(--ink); font-size: 16px; }
.card.us .ushead svg:first-child { color: var(--pink); }
.card.us .ask { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--pink-soft); color: var(--pink); }

.us-stats .big { font-size: 26px; font-weight: 700; }
.dice { margin-top: 10px; padding: 14px; border-radius: 14px; background: var(--pink-soft); color: var(--pink); font-weight: 650; text-align: center; animation: pop .25s ease-out; }

/* word stakes */

.stake > svg { color: var(--amber); flex: none; }

/* Tempo */
.tpad { display: grid; place-items: center; width: 190px; height: 190px; margin: 18px auto 10px; border-radius: 50%; font-size: 20px; font-weight: 700; color: var(--lilac);
  background: radial-gradient(circle, var(--lilac-soft) 0 55%, transparent 56%), conic-gradient(var(--ring-a), var(--ring-b), var(--ring-a)); padding: 0; transition: transform .08s; touch-action: manipulation; }
.tpad span { display: grid; place-items: center; width: 150px; height: 150px; border-radius: 50%; background: var(--surface); }
.tpad.live { color: var(--pink); }

@keyframes thump { 0% { transform: scale(1.08); filter: brightness(1.25); } 100% { transform: scale(1); } }

/* wrapped */
.wrapped-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 15px 16px; border-radius: 18px; margin-bottom: 12px; color: #fff;
  background: linear-gradient(120deg, #d9608f, #7f62d6); }
.wrapped-btn svg { flex: none; }
.story { position: fixed; inset: 0; z-index: 20; color: #fff; padding: calc(18px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; transition: background .5s; }
.story.ga { background: linear-gradient(160deg, #1a1033, #5b2a73 55%, #d9608f); }
.story.gb { background: linear-gradient(160deg, #2a0f2a, #8c2c63 50%, #f39ac2); }

.story .bars { display: flex; gap: 4px; }
.story .bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .3); }
.story .bars i.done { background: #fff; }
.story .bars i.on { background: linear-gradient(90deg, #fff 50%, rgba(255, 255, 255, .3) 50%); background-size: 200% 100%; animation: fill 5s linear forwards; }
@keyframes fill { from { background-position: 100% 0; } to { background-position: 0 0; } }
.story .sx { position: absolute; right: 16px; top: calc(30px + env(safe-area-inset-top)); background: rgba(255, 255, 255, .15); color: #fff; }
#storyBody { flex: 1; display: flex; align-items: center; }
.story .slide { width: 100%; animation: rise .45s ease-out; }
.story .eyebrow { color: rgba(255, 255, 255, .75); }
.story h1 { font-size: 40px; line-height: 1.05; letter-spacing: -.02em; margin: 10px 0; }
.story h2 { font-size: 24px; margin: 10px 0; }
.story p { font-size: 18px; opacity: .9; }
.story .huge { font-size: 84px; font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 12px 0; }
.story .dim { font-size: 40px; opacity: .6; font-weight: 600; }
.story .btn.primary { background: #fff; color: #2a1640; box-shadow: none; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* daily intro */
.intro { position: fixed; inset: 0; z-index: 19; display: flex; align-items: flex-end; justify-content: center; background: linear-gradient(165deg, #1a1033, #4b2a73 50%, #c9588a); color: #fff; transition: opacity .35s, transform .35s; }
.intro.out { opacity: 0; transform: scale(1.03); }
.intro .in { width: 100%; max-width: 520px; padding: 24px 24px calc(30px + env(safe-area-inset-bottom)); }
.intro h1 { font-size: 44px; line-height: 1.02; letter-spacing: -.03em; margin: 10px 0 8px; }
.intro .eyebrow { color: rgba(255, 255, 255, .72); }
.intro .era { display: inline-block; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .14); font-weight: 650; font-size: 14px; }
.intro .istats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 22px 0 18px; }
.intro .istats div { background: rgba(255, 255, 255, .1); border-radius: 16px; padding: 12px; }
.intro .istats b { display: block; font-size: 26px; }
.intro .istats span { font-size: 12.5px; opacity: .8; }
.intro .ich { margin-bottom: 14px; }
.intro .ich > div:not(.eyebrow) { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-weight: 550; }
.intro p { opacity: .85; margin: 6px 0; }
.intro .btn.primary { background: #fff; color: #2a1640; margin-top: 14px; box-shadow: none; }
.intro .eq { display: flex; align-items: flex-end; gap: 3px; height: 46px; margin-bottom: 26px; }
.intro .eq i { flex: 1; border-radius: 2px; background: rgba(255, 255, 255, .55); height: 30%; animation: eq 1.1s ease-in-out infinite alternate; }
.intro .eq i:nth-child(3n) { animation-duration: .8s; background: rgba(255, 170, 210, .8); }
.intro .eq i:nth-child(4n+1) { animation-duration: 1.4s; }
@keyframes eq { 0% { height: 12%; } 100% { height: 100%; } }
.intro :is(.l1, .l2, .l3, .l4, .l5, .l6, .l7) { animation: rise .5s ease-out backwards; }
.intro .l2 { animation-delay: .08s; } .intro .l3 { animation-delay: .16s; } .intro .l4 { animation-delay: .24s; }
.intro .l5 { animation-delay: .32s; } .intro .l6 { animation-delay: .4s; } .intro .l7 { animation-delay: .48s; }
@media (prefers-reduced-motion: reduce) { .intro .eq i, .boost, .intro :is(.l1, .l2, .l3, .l4, .l5, .l6, .l7), .story .slide { animation: none; } }

/* Health. Sleep-stage colours validated for colour-blind separation on both surfaces. */
:root { --st0: #d9577f; --st1: #c98a1a; --st2: #1f8fa8; --st3: #5a3fb5; }
:root[data-theme="dark"], :root[data-theme="rave"], :root[data-theme="grove"], :root[data-theme="vice"] { --st0: #d65c86; --st1: #a87a1c; --st2: #2b9bb0; --st3: #8f63e8; }
@media (prefers-color-scheme: dark) { :root[data-theme="auto"] { --st0: #d65c86; --st1: #a87a1c; --st2: #2b9bb0; --st3: #8f63e8; } }
nav.tabs button { max-width: 92px; font-size: 11px; }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -2px 0 12px; }
.daynav b { font-size: 15px; }
.daynav .iconbtn[disabled] { opacity: .35; }
.hhero { display: flex; gap: 16px; align-items: center; }
.htile { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 9px 12px; border-radius: 14px; background: var(--raised); }
.htile span { font-size: 12.5px; color: var(--muted); font-weight: 600; }

.htile em { font-style: normal; font-size: 12px; color: var(--muted); }
.htile.ready { background: var(--good-soft); } .htile.ready span, .htile.ready em { color: var(--good); }
.htile.sleep { background: var(--lilac-soft); } .htile.sleep span, .htile.sleep em { color: var(--lilac); }
.htile.heart { background: var(--pink-soft); } .htile.heart span, .htile.heart em { color: var(--pink); }
.hyp { display: flex; gap: 10px; }
.hyp .hl { flex: none; width: 66px; padding-top: 6px; }
.hyp .hl div { display: flex; flex-direction: column; justify-content: flex-start; }
.hyp .hl b { font-size: 13px; line-height: 1.1; }
.hyp .hl span { font-size: 12px; color: var(--muted); }
.hyp .hc { flex: 1; min-width: 0; }
.hypsvg { width: 100%; height: 182px; display: block; overflow: visible; }
.hypsvg .track { fill: var(--raised); }
.hypsvg .links line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.st0 { fill: var(--st0); background: var(--st0); } .st1 { fill: var(--st1); background: var(--st1); }
.st2 { fill: var(--st2); background: var(--st2); } .st3 { fill: var(--st3); background: var(--st3); }
.hypsvg rect[data-tip] { stroke: var(--surface); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; }
.hypsvg rect.sel { stroke: var(--ink); stroke-width: 2; }
.axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.readout { margin-top: 6px; min-height: 18px; color: var(--ink); font-weight: 550; }
.readout.muted { font-weight: 400; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar { fill: var(--lilac-mid); }
.chart .bar.on { fill: var(--lilac); }
.chart .bar.dim { opacity: .4; }
.chart g.sel .bar, .chart g.sel .dot { fill: var(--pink); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .goal { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
.chart .line { fill: none; stroke: var(--lilac); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--lilac); stroke: var(--surface); stroke-width: 2; vector-effect: non-scaling-stroke; }
.chart .rng { stroke: var(--pink-mid); stroke-width: 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.chart .xl { display: grid; margin-top: 4px; font-size: 11.5px; color: var(--muted); text-align: center; }
.sb { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; margin-top: 5px; }
.range { position: relative; height: 8px; border-radius: 4px; background: var(--raised); margin: 6px 0 3px; }
.range .band { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--lilac-soft); outline: 1px dashed var(--lilac-mid); }
.range .mark { position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px; margin-left: -2px; box-shadow: 0 0 0 2px var(--surface); }
.hstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.hstats b { display: block; font-size: 18px; }
.hstats span { font-size: 11.5px; color: var(--muted); line-height: 1.25; display: block; }
.setup { padding-left: 20px; margin: 6px 0; } .setup li { margin: 5px 0; }
.hook { display: flex; gap: 8px; align-items: center; background: var(--surface); border-radius: 12px; padding: 8px 8px 8px 12px; }
.hook code { flex: 1; min-width: 0; font-size: 11.5px; overflow-wrap: anywhere; color: var(--ink); }
.swap { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--lilac-soft); margin-bottom: 12px; }

/* Grove (San Andreas): green on near-black, desert orange */
:root[data-theme="grove"] {
  color-scheme: dark;
  --bg: #0b110d; --surface: #121b15; --raised: #1a261e; --ink: #eef6ef; --muted: #9fb5a4; --faint: #6b8271; --line: #223026;
  --lilac: #4fc97a; --lilac-soft: #15301f; --lilac-mid: #2f6b45;
  --pink: #f0a845; --pink-soft: #33260f; --pink-mid: #7a5420;
  --good: #7ed6a5; --good-soft: #163324; --warn: #ff7b6b; --amber: #ffd37a; --amber-soft: #33270a;
  --tile-g: #3fae6a; --tile-y: #d9a12a; --tile-b: #2d3a31; --ring-a: #f0a845; --ring-b: #4fc97a; --shadow: none;
}
:root[data-theme="grove"] body { background: radial-gradient(900px 500px at 100% -10%, rgba(79, 201, 122, .14), transparent 60%), radial-gradient(700px 400px at -10% 110%, rgba(240, 168, 69, .10), transparent 60%), var(--bg); background-attachment: fixed; }
:root[data-theme="grove"] .btn.primary { color: #08140c; }
:root[data-theme="grove"] h1 { letter-spacing: -.01em; text-transform: uppercase; font-weight: 800; }

/* Vice (Vice City): neon pink and teal sunset */
:root[data-theme="vice"] {
  color-scheme: dark;
  --bg: #12091f; --surface: #1b1130; --raised: #26183f; --ink: #fff1fb; --muted: #c6aeda; --faint: #8a74a3; --line: #33224f;
  --lilac: #ff5fae; --lilac-soft: #3d1736; --lilac-mid: #8f2c66;
  --pink: #2fe0d6; --pink-soft: #0f3437; --pink-mid: #1f7a76;
  --good: #6ff0b8; --good-soft: #10331f; --warn: #ff7aa8; --amber: #ffd36b; --amber-soft: #35290b;
  --tile-g: #33b383; --tile-y: #e0a92c; --tile-b: #3a2e52; --ring-a: #2fe0d6; --ring-b: #ff5fae; --shadow: 0 10px 30px rgba(255, 95, 174, .08);
}
:root[data-theme="vice"] body { background: linear-gradient(180deg, rgba(255, 95, 174, .16), transparent 320px), radial-gradient(700px 420px at 110% 20%, rgba(47, 224, 214, .12), transparent 60%), var(--bg); background-attachment: fixed; }
:root[data-theme="vice"] .btn.primary { color: #1a0718; background: linear-gradient(120deg, #ff6fb8, #ff9a6b); }
:root[data-theme="vice"] h1 { font-style: italic; background: linear-gradient(90deg, #ff5fae, #ffb36b 55%, #2fe0d6); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="vice"] nav.tabs button[aria-current="page"], :root[data-theme="grove"] nav.tabs button[aria-current="page"] { color: var(--lilac); }

/* accents (light, then every dark theme) */
:root[data-accent="pink"] { --lilac: #b03a6e; --lilac-soft: #fdeaf2; --lilac-mid: #f3b8cf; --ring-b: #f38ab5; }
:root[data-accent="green"] { --lilac: #23855a; --lilac-soft: #e3f4ea; --lilac-mid: #a9dcbf; --ring-b: #4fbf85; }
:root[data-accent="teal"] { --lilac: #0f7e8a; --lilac-soft: #dff4f5; --lilac-mid: #9fd8de; --ring-b: #2fb8c4; }
:root[data-accent="orange"] { --lilac: #b4570f; --lilac-soft: #fdeedd; --lilac-mid: #f3c79a; --ring-b: #f39a4c; }

:root:is([data-theme="dark"], [data-theme="rave"], [data-theme="grove"], [data-theme="vice"])[data-accent="green"] { --lilac: #7ed6a5; --lilac-soft: #1d3428; --lilac-mid: #2f6b4c; --ring-b: #5fd79a; }
:root:is([data-theme="dark"], [data-theme="rave"], [data-theme="grove"], [data-theme="vice"])[data-accent="teal"] { --lilac: #6fd6df; --lilac-soft: #163339; --lilac-mid: #2a6b73; --ring-b: #45c9d4; }
:root:is([data-theme="dark"], [data-theme="rave"], [data-theme="grove"], [data-theme="vice"])[data-accent="orange"] { --lilac: #ffb070; --lilac-soft: #3a2814; --lilac-mid: #7a4a1f; --ring-b: #ff9b4f; }
:root:is([data-theme="dark"], [data-theme="rave"], [data-theme="grove"], [data-theme="vice"])[data-accent="blue"] { --lilac: #9db8ff; --lilac-soft: #1c2640; --lilac-mid: #3a4f85; --ring-b: #7d9dff; }
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"][data-accent="pink"] { --lilac: #ff9cc8; --lilac-soft: #3a2331; --lilac-mid: #7a3d5a; --ring-b: #ff86bd; }
  :root[data-theme="auto"][data-accent="green"] { --lilac: #7ed6a5; --lilac-soft: #1d3428; --lilac-mid: #2f6b4c; --ring-b: #5fd79a; }
  :root[data-theme="auto"][data-accent="teal"] { --lilac: #6fd6df; --lilac-soft: #163339; --lilac-mid: #2a6b73; --ring-b: #45c9d4; }
  :root[data-theme="auto"][data-accent="orange"] { --lilac: #ffb070; --lilac-soft: #3a2814; --lilac-mid: #7a4a1f; --ring-b: #ff9b4f; }
  :root[data-theme="auto"][data-accent="blue"] { --lilac: #9db8ff; --lilac-soft: #1c2640; --lilac-mid: #3a4f85; --ring-b: #7d9dff; }
}
:root[data-text="large"] main { zoom: 1.1; }
.calm *, .calm *::before, .calm *::after { animation: none !important; transition: none !important; }

/* characters */
.av { display: inline-grid; place-items: center; flex: none; border-radius: 28%; overflow: hidden; }
.av svg { width: 100%; height: 100%; display: block; }

  background: linear-gradient(120deg, var(--c1, #5b44b8), var(--c2, #2a1f4f)); }
.charcard .grow { display: flex; flex-direction: column; gap: 2px; }

/* cash and empire */
.cashrow { width: 100%; text-align: left; padding: 0; color: inherit; }

.card.bank { color: #fff; border: 0; background: linear-gradient(125deg, #1f6b46, #2f9e6a 45%, #c9a227); }

/* music */

  background: radial-gradient(circle, #111 0 14%, var(--c1) 15% 36%, #161616 37% 100%); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .06), 0 6px 18px rgba(0, 0, 0, .25);
  background-image: radial-gradient(circle, #111 0 14%, var(--c1) 15% 36%, transparent 37%), repeating-radial-gradient(circle, #1b1b1b 0 2px, #121212 2px 4px); }

  function importSheet() {
    openSheet('<h2>Import your history</h2><p class="small muted" style="margin:4px 0 12px">Pulls past days from your watch through HC Webhook on this phone.</p>' +

      '<div class="divider"></div><b class="small">If that doesn\'t work: use a file</b><ol class="small setup"><li>With the Local HTTP server on, open <b>127.0.0.1:8787/?days=365</b> in Chrome (tap to copy: <button class="chip" type="button" data-fun="copyLocal">copy address</button>). You\'ll see a page of text.</li>' +

  }
  function dayOfIso(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function importHistory(n) {
    var port = (el('hcPort') && el('hcPort').value.trim()) || '8787', msg = function (m) { var x = el('importMsg'); if (x) x.textContent = m; };
    save('hcPort', port);
    msg('Reading ' + n + ' days from your watch…');
    fetch('http://127.0.0.1:' + port + '/?days=' + n, { targetAddressSpace: 'loopback' }).then(function (r) { if (!r.ok) throw new Error('HC Webhook said ' + r.status); return r.json(); }).then(uploadHealth).catch(function () {
      msg('Couldn\'t reach HC Webhook from the app (Chrome blocks it on some phones). Use the file way below instead.');
    });
  }
  function uploadHealth(p) {
    var msg = function (m) { var x = el('importMsg'); if (x) x.textContent = m; };
    (function () {
      var byDay = {};
      Object.keys(p).forEach(function (type) {
        if (!Array.isArray(p[type])) return;
        p[type].forEach(function (rec) {
          var ymd = dayOfIso(rec.session_end_time || rec.start_time || rec.time);
          if (!ymd) return;
          delete rec.metadata;
          ((byDay[ymd] = byDay[ymd] || {})[type] = byDay[ymd][type] || []).push(rec);
        });
      });
      var dates = Object.keys(byDay).sort(), done = 0;
      if (!dates.length) { msg('Nothing found. Check HC Webhook has Health Connect permissions.'); return; }
      (function next() {
        if (!dates.length) { msg('Imported ' + done + ' days.'); toast('History imported'); return refreshQuiet(); }
        var batch = dates.splice(0, 4), payload = {};
        batch.forEach(function (d) { Object.keys(byDay[d]).forEach(function (t) { payload[t] = (payload[t] || []).concat(byDay[d][t]); }); });
        msg('Uploading… ' + done + ' of ' + (done + batch.length + dates.length) + ' days');
        rpc('importHealth', [JSON.stringify(payload)]).then(function () { done += batch.length; next(); }, function (e) { msg('Stopped: ' + e.message + '. Tap again to retry.'); });
      })();
    })();
  }
  document.addEventListener('change', function (ev) {
    if (ev.target.id !== 'hcFile' || !ev.target.files[0]) return;
    var msg = function (m) { var x = el('importMsg'); if (x) x.textContent = m; };
    msg('Reading the file…');
    ev.target.files[0].text().then(function (txt) {
      var p;
      try { p = JSON.parse(txt.slice(txt.indexOf('{'))); } catch (e) { return msg('That file isn\'t the health data. Open the 127.0.0.1 address again and download that page.'); }
      uploadHealth(p);
    });
  });

      if (dd[k].done) { buzz(20); startRest(restSecs(ds.rest)); }
      return drawFinish();
    }
    if (ds.restadd) { if (rest) { rest.until = Math.max(now() + 5000, rest.until + +ds.restadd * 1000); save('rest', rest); drawRest(); armRest(); } return; }
    if (t.id === 'restSkip') { endRest(); armRest(); return; }
    if (t.id === 'finishWk') return finishWorkout();
    if (ds.exmenu) return exMenu(ds.exmenu);
    if (ds.tmedit) { tmOpen[ds.tmedit] = !tmOpen[ds.tmedit]; renderTrain(); var tf = document.querySelector('form[data-tm="' + ds.tmedit + '"] input'); if (tf) tf.focus(); return; }
    if (t.id === 'addEx') return addExSheet();
    if (ds.exset) { var eid = ds.ex, dir = +ds.exset; editCust(true, function (c) { c.extra[eid] = (c.extra[eid] || 0) + dir; }); return renderTrain(); }
    if (ds.exdrop && exTarget) { var did = exTarget, keep = el('exKeep') && el('exKeep').checked; editCust(keep, function (c) { if (did.indexOf('Add|') === 0) c.add = c.add.filter(function (x) { return 'Add|' + x.exercise !== did; }); else if (c.drop.indexOf(did) === -1) c.drop.push(did); }); if (did.indexOf('Add|') === 0) editCust(!keep, function (c) { c.add = c.add.filter(function (x) { return 'Add|' + x.exercise !== did; }); }); closeSheet(); return renderTrain(); }
    if (ds.exback && exTarget) { var bid = exTarget; custKeys(tsel).forEach(function (ck) { var c = load(ck); if (c && c.swap) { delete c.swap[bid]; save(ck, c); } }); closeSheet(); return renderTrain(); }
    if (t.id === 'resetCust') { if (!confirm('Put ' + tsel + ' back to the plan? Your logged sets today stay ticked.')) return; custKeys(tsel).forEach(function (ck) { save(ck, null); }); return renderTrain(); }
    // food
    if (ds.preset !== undefined) {
      var p = S.food.presets[+ds.preset], mine = { name: p.name, kcal: p.kcal, protein: p.protein };
      pending.push(mine); renderFood(); buzz(15);
      var drop = function () { pending.splice(pending.indexOf(mine), 1); };
      rpc('logPreset', [p.name]).then(function (res) { drop(); S.food = res.state; renderFood(); offerUndo(res.undo, 'Logged ' + itemsText(res.added)); }, function (err) { drop(); renderFood(); toast(err.message, true); });
      return;
    }
    if (t.id === 'undo') return call('undoLast', [], function (res) { S.food = res.state; renderFood(); toast('Removed ' + res.removed.join(', ')); });
    if (ds.shopdel) return quick(function () { S.shopping = S.shopping.filter(function (x) { return x.id !== ds.shopdel; }); }, 'removeShopping', [ds.shopdel], 'Removed');
    if (ds.fdel) return call('removeFood', [ds.fdel, ds.fitem], function (res) { closeSheet(); S.food = res.state; renderFood(); toast('Removed ' + ds.fitem); });
    if (ds.fedit) {
      var fe = S.food.entries.filter(function (x) { return x.entry === ds.fedit && x.item === ds.fitem; })[0]; if (!fe) return;
      sheetKind = 'food';
      openSheet('<h3 style="margin:0 0 10px">Change this</h3><form id="foodEdit" data-entry="' + esc(fe.entry) + '" data-item="' + esc(fe.item) + '" autocomplete="off">' +
        '<label class="small">What<input type="text" id="feItem" value="' + esc(fe.item) + '"></label>' +
        '<div class="grid2" style="margin-top:8px"><label class="small">kcal<input type="number" inputmode="numeric" id="feKcal" value="' + fe.kcal + '" min="0"></label><label class="small">Protein (g)<input type="number" inputmode="decimal" step="0.5" id="feProt" value="' + fe.protein + '" min="0"></label></div>' +
        '<div class="grid2" style="margin-top:12px"><button class="btn line" type="button" data-fdel="' + esc(fe.entry) + '" data-fitem="' + esc(fe.item) + '">' + icon('trash', 's') + 'Remove</button><button class="btn primary" type="submit">Save</button></div></form>');
      return;
    }
    if (t.id === 'ideas') { toast('Thinking of ideas…'); return call('mealIdeas', [], function (list) { ideas = list; renderFood(); }); }
    if (t.id === 'ideasClose') { ideas = null; return renderFood(); }
    if (ds.idea !== undefined) { var idea = ideas[+ds.idea]; return call('logIdea', [idea], function (res) { S.food = res.state; ideas = null; renderFood(); offerUndo(res.undo, 'Logged ' + idea.name); }); }
    // you
    if (ds.reward) return call('redeemReward', [ds.reward], function (res) { confetti(true); apply(res, 'Enjoy: ' + ds.reward); });
    if (ds.addshop) return call('addShopping', [ds.addshop], function (res) { apply(res, 'Added ' + ds.addshop); });
    if (t.id === 'pushOn') return Notification.permission === 'granted' && S.push.devices ? testPush() : enablePush();
    if ((t.id === 'install' || t.id === 'navInstall') && deferredInstall) { deferredInstall.prompt(); deferredInstall = null; var ni = el('navInstall'); if (ni) ni.hidden = true; return; }
  });

  function wordKey(k) {
    var wd = S.games.word;
    if (wd.done) return;
    if (k === 'back') typed = typed.slice(0, -1);
    else if (k === 'enter') {
      if (typed.length < 5) return shakeRow('Not enough letters');
      if (!allowed(typed)) return shakeRow('Not in the word list');
      var guess = typed;
      wd.guesses.push(guess); wd.colours.push(''); typed = ''; renderPlay();
      rpc('guessWord', [guess]).then(function (g) {
        S.games = g; renderPlay();
        var w = g.word;
        if (w.done) { if (w.won) { confetti(true); chime([660, 880, 1100]); toast(['Genius', 'Magnificent', 'Impressive', 'Splendid', 'Great', 'Phew'][w.guesses.length - 1]); } else toast('The word was ' + w.answer.toUpperCase()); refreshQuiet(); }
      }, function (err) { wd.guesses.pop(); wd.colours.pop(); typed = guess; renderPlay(); shakeRow(err.message); });
      return;
    } else if (typed.length < 5 && /^[a-z]$/.test(k)) typed += k;
    renderPlay();
  }
  function shakeRow(msg) {
    toast(msg);
    var r = document.querySelector('.board .r.cur');
    if (r) { r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); }
  }
  document.addEventListener('keydown', function (e) {
    if (current !== 'play' || playView !== 'word' || !S || e.target.closest('input, textarea')) return;
    if (e.key === 'Enter') wordKey('enter');
    else if (e.key === 'Backspace') wordKey('back');
    else if (/^[a-zA-Z]$/.test(e.key)) wordKey(e.key.toLowerCase());
  });

  function dumpReview(items) {
    wn.dump = items;
    var kinds = [['task', 'To do'], ['recurring', 'Repeating chore'], ['shopping', 'Shopping'], ['park', 'Save for later'], ['skip', 'Skip']];
    openSheet('<h2>Here\'s what I heard</h2><p class="small muted" style="margin:4px 0 12px">Change anything, then save.</p>' + items.map(function (it, i) {
      return '<div class="item" style="flex-wrap:wrap"><div class="grow" style="min-width:55%">' + esc(it.text) + (it.kind === 'recurring' && it.every ? ' <span class="muted small">· ' + esc(it.every) + '</span>' : '') + '</div>' +
        '<select data-dk="' + i + '" aria-label="What is it" style="width:auto;padding:8px 10px">' + kinds.map(function (k) { return '<option value="' + k[0] + '"' + (k[0] === it.kind ? ' selected' : '') + '>' + k[1] + '</option>'; }).join('') + '</select></div>';
    }).join('') + '<button class="btn primary big wide" type="button" id="dumpSave" style="margin-top:14px">Save</button>');
  }

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (busy || !S) return;
    if (f.id === 'custom') { var tx = el('customText').value.trim(); if (!tx) { toast('Type the job first'); return; } toast(S.hasClaudeKey ? 'Working out how long that takes…' : 'Set the time, then start.'); return call('planChore', [tx], function (p) { plan = p; renderAll(); }); }
    if (f.id === 'park') { var v = el('parkText').value.trim(); if (!v) { toast('Type what popped into your head'); return; } var task = mySession().task; return call('parkThing', [v], function (res) { parking = false; apply(res, 'Saved for later. Back to ' + task + '.'); }); }
    if (f.id === 'weighForm') { var wv = el('weighText').value.trim(); if (!wv) { toast('Type your weight first, like 82.4'); el('weighText').focus(); return; } return call('logWeightNow', [wv], function (t) { S.today = t; addXpLocal(10); renderAll(); toast('Logged ' + t.lastWeight.kg + ' kg'); refreshQuiet(); }); }
    if (f.id === 'shopForm') { var it = el('shopText').value.trim(); if (!it) { toast('Type what you need first'); el('shopText').focus(); return; } el('shopText').value = ''; return call('addShopping', [it], function (res) { apply(res, 'Added'); }); }
    if (f.dataset.tm) { var ins = f.querySelectorAll('input'); return call('setTrainingMax', [f.dataset.tm, +ins[0].value, +ins[1].value], function (t) { tmOpen = {}; S.train = t; renderTrain(); var c = t.tmSet; if (t.undo) { undoSeen = ''; offerUndo(t.undo, c ? c.lift + ' training max ' + (c.from ? c.from + ' → ' : '') + c.to + ' kg. Weights updated.' : 'Training max set.'); } else toast('Training max set.'); }); }
    if (f.id === 'quick') {
      var text = el('quickText').value.trim(); if (!text) { toast('Type what you ate, like "2 eggs on toast"'); return; }
      el('quickBtn').disabled = true; el('quickNote').textContent = 'Working it out…';
      return call('quickAdd', [text], function (res) { el('quickText').value = ''; S.food = res.state; renderFood(); offerUndo(res.undo, 'Logged ' + itemsText(res.added)); }, function () { renderFood(); });
    }
    if (f.id === 'keyForm') { var val = el('keyText').value.trim(); if (!val) { toast('Paste your Claude key first'); return; } return call('saveClaudeKey', [val], function (s) { el('keyText').value = ''; S.food = s; S.hasClaudeKey = true; renderAll(); toast('Claude key saved.'); }); }
    if (f.id === 'nudgeForm') { var nt = el('nudgeText').value.trim(); if (!nt) { toast('Type a message, or tap one above'); return; } return call('sendNudge', [nt], function (r) { closeSheet(); toast(r.delivered ? 'Sent' : 'Couldn\'t reach them right now'); }); }
    if (f.id === 'askForm') {
      var q = el('askText').value.trim(); if (!q) { toast('Type something to ask'); return; }
      chat.push({ r: 'me', t: q }); chat.push({ r: 'ai', t: '…' }); askSheet();
      return call('ask', [q], function (res) {
        chat.pop(); chat.push({ r: 'ai', t: res.reply });
        res.done.forEach(function (d) { chat.push({ r: 'done', t: d }); });
        chat = chat.slice(-20); save('chat-' + KEY.slice(0, 6), chat);
        apply(res.state);
        if (res.startJob) { chat.push({ r: 'done', t: 'Ready to start: ' + res.startJob.name }); plan = res.startJob; closeSheet(); renderAll(); showTab('chores'); return; }
        askSheet();
      }, function () { chat.pop(); askSheet(); });
    }
  });

  // ---------- timers, refresh, live games ----------
  setInterval(function () {
    if (!S) return;
    tickTimer();
    if (rest) {
      var left = rest.until - now();
      if (el('restLeft')) el('restLeft').textContent = clock(left);
      if (left <= 0) { endRest(); chime([880, 1175, 1568]); buzz([120, 60, 120]); toast('Rest over. Next set.'); if (document.hidden && swReg && swReg.showNotification) swReg.showNotification('Rest over', { body: 'Next set: you\'ve got this.', tag: 'timer-rest', renotify: true, vibrate: [200, 100, 200] }).catch(function () {}); }
    }
    var tb = el('dotTrain'); if (tb) tb.textContent = rest ? clock(rest.until - now()) : '';
    document.querySelectorAll('[data-due]').forEach(function (x) { x.textContent = dueLabel(+x.getAttribute('data-due')); });
    var bl = boostLeft(), be = el('boostLeft');
    if (be) be.textContent = bl + ' min';
    if (!!bl !== lastBoost) { lastBoost = !!bl; renderHome(); }
  }, 1000);
  var lastBoost = false;
  function refresh() {
    if (!S || busy || inflight || parking || !el('sheetbg').hidden || document.visibilityState !== 'visible') return;
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (current === 'train' || current === 'food' || (current === 'play' && (recallGame || (mix && mix.on) || tempo))) return;
    rpc('appState', []).then(function (res) { if (!busy && !inflight) apply(res); }, function () {});
  }
  function refreshQuiet() { rpc('appState', []).then(function (res) { if (!busy && !inflight) apply(res); }, function () {}); }
  setInterval(refresh, 30000);
  // While you're on the word game and your partner is mid-game, watch them live.
  function pollGames() {
    if (current !== 'play' || document.visibilityState !== 'visible' || !S) return;
    var o = S.games.word.other;
    if (playView === 'word' && (!o || !o.done) && Date.now() - lastWordPoll > 4000 && !inflight && !busy) {
      lastWordPoll = Date.now();
      rpc('gamesState', []).then(function (g) { if (current === 'play' && !typed && !recallGame) { S.games = g; renderPlay(); } }, function () {});
    }
  }
  setInterval(pollGames, 5000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(); });

  // ---------- push notifications (installed app) ----------
  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  var swReg = null;
  function enablePush(silent) {
    if (!CFG.firebase || !('serviceWorker' in navigator)) return;
    var V = '10.14.1';
    return Promise.all([loadScript('https://www.gstatic.com/firebasejs/' + V + '/firebase-app-compat.js')]).then(function () {
      return loadScript('https://www.gstatic.com/firebasejs/' + V + '/firebase-messaging-compat.js');
    }).then(function () {
      if (!firebase.apps.length) firebase.initializeApp(CFG.firebase);
      return silent ? Notification.permission : Notification.requestPermission();
    }).then(function (perm) {
      if (perm !== 'granted') { if (!silent) toast('Notifications are off. You can turn them on in your phone settings.', true); throw null; }
      return (swReg ? Promise.resolve(swReg) : navigator.serviceWorker.ready).then(function (reg) { swReg = reg; return firebase.messaging().getToken({ serviceWorkerRegistration: reg, vapidKey: CFG.vapidKey || undefined }); });
    }).then(function (token) {
      return rpc('registerDevice', [token, navigator.userAgent.slice(0, 60)]);
    }).then(function () {
      S.push.devices = Math.max(1, S.push.devices || 0); save('pushReg', now());
      if (!silent) { renderAll(); testPush(); }
      firebase.messaging().onMessage(function (p) { var n = p.notification || p.data || {}; toast((n.title || '') + (n.body ? ': ' + n.body : '')); chime([880, 1175]); refreshQuiet(); });
    }).catch(function (e) { if (e && !silent) toast('Couldn\'t turn on notifications: ' + (e.message || e), true); });
  }
  function pushDetails() {
    var p = S.push, t = function (ms) { var d = new Date(ms); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
    return '<div class="pushinfo small">' +
      '<div>' + (p.devices ? p.devices + ' phone' + (p.devices === 1 ? '' : 's') + ' registered' : '<b class="bad">No phone registered yet</b>') + (p.phones && p.phones.length ? ' · ' + p.phones.map(function (x) { return esc(/iPhone|iPad/.test(x.label) ? 'iPhone' : /Android/.test(x.label) ? 'Android' : /Windows|Macintosh|CrOS/.test(x.label) ? 'Computer' : 'Phone'); }).join(', ') : '') + '</div>' +
      (p.lastOk ? '<div>Last delivered: ' + t(p.lastOk) + '</div>' : '<div class="muted">Nothing delivered yet</div>') +
      (p.lastError ? '<div class="bad">Last problem (' + t(p.lastError.at) + '): ' + esc(p.lastError.error) + '</div>' : '') +
      '<div class="muted">On a Pixel: install the app (Chrome menu, Install app), open it from the home screen, tap Turn on. Then in Android Settings, Apps, Life Quest, Notifications, make sure they\'re allowed.</div></div>';
  }
  function testPush() {
    toast('Sending a test to this phone…');
    rpc('testPush', []).then(function (r) {
      S.push = r.status; renderAll();
      if (r.sent) toast('Sent to ' + r.sent + ' phone' + (r.sent === 1 ? '' : 's') + '. It should pop up in a few seconds (close the app to see it as a notification).');
      else if (!r.status.configured) toast('Notifications aren\'t set up on the server.', true);
      else if (!r.status.devices) toast('This phone isn\'t registered. Tap Turn on.', true);
      else toast('Google didn\'t deliver it: ' + ((r.results[0] && r.results[0].error) || 'no reason given'), true);
    }, function (e) { toast(e.message, true); });
  }

  // ---------- start ----------
  if (MODE === 'web' && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function (r) { swReg = r; if (window.Notification && Notification.permission === 'granted' && KEY) enablePush(true); }).catch(function () {});
  }
  if (MODE === 'web' && 'serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.tab && S) { showTab(e.data.tab); if (e.data.deadline && e.data.act) handleNoteAction(e.data.deadline, e.data.act); else refreshQuiet(); } });
  if (!ME) el('nav').querySelectorAll('[data-me]').forEach(function (b) { b.remove(); });
  function boot() {
    if (!S) return;
    ME = S.who === 'me';
    if (!ME) el('nav').querySelectorAll('[data-me]').forEach(function (b) { b.remove(); });
    if (!load('badges-' + S.who)) save('badges-' + S.who, S.game.badges.filter(function (b) { return b.earned; }).map(function (b) { return b.id; }));
    renderAll();
    var hash = location.hash.replace('#', '');
    showTab(['home', 'chores', 'work', 'play', 'train', 'food', 'health', 'you', 'custom', 'empire'].indexOf(hash) !== -1 ? hash : (window.LQ_TAB || load('tab') || 'home'));
    lastBoost = !!boostLeft();
    if (hash === 'djset') {   // straight to the DJ game (the Chrome add-on's "DJ Set in a tab")
      playView = 'mix'; save('playView', 'mix'); showTab('play');
      history.replaceState(null, '', location.pathname + location.search + '#play');
      setTimeout(openSet, 300);
    }
    var na = location.hash.match(/dl=(\w+):(\w+)/);
    if (na) { history.replaceState(null, '', location.pathname + location.search + '#home'); setTimeout(function () { handleNoteAction(na[1], na[2]); }, 400); }
    if (hash !== 'djset') setTimeout(intro, 250);
    if (!S.brief && S.hasClaudeKey) rpc('getBrief', []).then(function (b) { if (b) { S.brief = b; renderHome(); } }, function () {});
  }
  if (!KEY) {
    el('tab-home').innerHTML = '<div class="loading"><h2>Open your app link</h2><p class="muted">Paste your link from the Config tab of your Google Sheet (Your app link, or Partner app link). It has your private key in it.</p>' +
      '<form class="inline" id="linkForm" autocomplete="off" style="margin-top:16px"><input type="text" id="linkText" placeholder="Paste your link" aria-label="Your app link"><button class="btn primary" type="submit">Open</button></form></div>';
    el('tab-home').hidden = false;
    el('nav').hidden = true;
    el('linkForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = el('linkText').value.trim(), m = v.match(/key=([A-Za-z0-9]+)/) || v.match(/^([A-Za-z0-9]{20,})$/);
      if (!m) { toast('That doesn\'t look like your link. It ends in ?key= and a long code.', true); return; }
      save('key', m[1]); location.href = location.pathname + '?key=' + m[1];
    });
  } else if (S) {
    boot();
    if (MODE === 'web') refreshQuiet();
  } else {
    el('tab-home').innerHTML = '<div class="loading">Loading…</div>';
    el('tab-home').hidden = false;
    rpc('appState', []).then(function (res) { S = res; offset = res.now - Date.now(); save('state-' + KEY.slice(0, 6), S); boot(); }, function (e) {
      el('tab-home').innerHTML = '<div class="loading"><h2>Couldn\'t load</h2><p class="muted">' + esc(e.message) + '</p><button class="btn primary" type="button" onclick="location.reload()">Try again</button></div>';
    });
  }
})();

</script>
