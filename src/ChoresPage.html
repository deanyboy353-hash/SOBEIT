<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1d21; --muted: #626875; --line: #e3e6eb;
    --accent: #1a73e8; --accent-text: #ffffff; --good: #188038; --warn: #b3261e; --bar: #e8eaed;
    --btn: #eef3fd; --btn-text: #0b57d0; --amber: #fef7e0; --amber-text: #7a4f01; --ring: #1a73e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316; --card: #1c1f24; --text: #e8eaed; --muted: #9aa0a6; --line: #2d3138;
      --accent: #8ab4f8; --accent-text: #0b1a33; --good: #81c995; --warn: #f28b82; --bar: #2d3138;
      --btn: #233149; --btn-text: #d3e3fd; --amber: #3d2e05; --amber-text: #fdd663; --ring: #8ab4f8;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.timesup { background: var(--amber); }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 12px; }
  .top h1 { font-size: 20px; margin: 0; }
  .top a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; margin-bottom: 8px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .person { background: var(--bg); border-radius: 14px; padding: 12px; min-width: 0; }
  .person b { display: block; font-size: 15px; }
  .person .st { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .person .mini { height: 6px; border-radius: 3px; background: var(--bar); margin-top: 8px; overflow: hidden; }
  .person .mini i { display: block; height: 100%; background: var(--accent); }
  .person .dn { color: var(--muted); font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; }
  .job { background: var(--btn); color: var(--btn-text); text-align: left; padding: 14px; min-height: 72px; display: flex; flex-direction: column; justify-content: space-between; font-weight: 600; transition: transform .08s; }
  .job:active { transform: scale(.97); }
  .job small { font-weight: 400; opacity: .85; font-size: 13px; }
  .primary { background: var(--accent); color: var(--accent-text); font-weight: 600; padding: 14px 18px; }
  .ghost { background: transparent; color: var(--accent); font-weight: 600; padding: 10px 6px; }
  .soft { background: var(--btn); color: var(--btn-text); font-weight: 600; padding: 14px 10px; }
  .wide { width: 100%; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .plan h2 { margin: 0 0 4px; font-size: 20px; }
  .mins { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .mins span { font-size: 28px; font-weight: 700; min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; }
  .mins button { width: 52px; height: 44px; }
  ol.steps { margin: 6px 0 12px; padding-left: 22px; }
  ol.steps li { margin: 3px 0; }
  .focus { text-align: center; }
  .focus .task { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .ringwrap { position: relative; width: 220px; height: 220px; margin: 6px auto 10px; }
  .ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ringwrap .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .ringwrap .t small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; text-align: center; }
  .now { background: var(--bg); border-radius: 16px; padding: 14px; margin: 6px 0 12px; text-align: left; }
  .now .k { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .now .s { font-size: 20px; font-weight: 600; margin: 2px 0 10px; }
  .checks { list-style: none; padding: 0; margin: 0 0 12px; text-align: left; }
  .checks li { display: flex; gap: 10px; align-items: center; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 15px; cursor: pointer; }
  .checks li:first-child { border-top: 0; }
  .checks .box { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-size: 13px; }
  .checks li.done { color: var(--muted); text-decoration: line-through; }
  .checks li.done .box { background: var(--good); border-color: var(--good); color: var(--card); }
  .checks li.cur { font-weight: 600; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .up { background: var(--card); border: 2px solid var(--amber-text); color: var(--amber-text); border-radius: 18px; padding: 14px; margin-bottom: 12px; font-weight: 600; }
  .later li { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .later li:first-child { border-top: 0; }
  .later ul { list-style: none; margin: 0; padding: 0; }
  .later .who { color: var(--muted); font-size: 13px; }
  .later .x { margin-left: auto; background: var(--btn); color: var(--btn-text); width: 40px; height: 36px; flex: none; }
  .note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .center { text-align: center; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: 20px; max-width: 528px; margin: 0 auto; background: var(--text); color: var(--bg); padding: 14px 16px; border-radius: 14px; font-size: 15px; transform: translateY(150%); transition: transform .2s; z-index: 5; }
  #toast:not(.show) { visibility: hidden; }
  #toast.show { transform: none; }
  #toast.err { background: var(--warn); color: #fff; }
</style>
</head>
<body>
<main>
  <div class="top"><h1>🧹 Chores</h1><a id="other" hidden>🍽️ Food</a></div>
  <section class="card"><div class="label">Together</div><div class="duo" id="duo"></div></section>
  <div id="view"></div>
  <section class="card later" id="laterCard" hidden><div class="label">🅿️ Parked for later</div><ul id="later"></ul></section>
  <p class="note center">Change jobs, times and steps in the Sheet: Chores tab.</p>
</main>
<div id="toast" role="status"></div>

<script>
  var KEY = <?!= JSON.stringify(key) ?>;
  var OTHER = <?!= JSON.stringify(otherUrl) ?>;
  var state = <?!= initialJson ?>;
  var offset = state.now - Date.now();
  var plan = null;      // job being set up, before Start
  var parking = false;  // the "park a distraction" box is open
  var busy = false;
  var halfwayShown = '', upShown = '';

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function now() { return Date.now() + offset; }
  function me() { return state.people[state.you]; }
  function them() { return state.people[state.you === 'me' ? 'partner' : 'me']; }
  function clock(ms) { var s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function minsLeft(sess) { return Math.max(0, Math.ceil((sess.endsAt - now()) / 60000)); }

  // ---- sound (unlocked by the first tap, which iPhones require) ----
  var audio;
  function unlockAudio() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
  }
  function chime(times) {
    if (!audio) return;
    for (var i = 0; i < times; i++) {
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.45;
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.start(t); o.stop(t + 0.4);
    }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  }
  document.addEventListener('pointerdown', unlockAudio, { capture: true });

  var wake;
  function keepAwake(on) {
    try {
      if (on && !wake && navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
      if (!on && wake) { wake.release(); wake = null; }
    } catch (e) {}
  }

  // ---- drawing ----
  function personCard(p, label) {
    var s = p.session;
    var st = s ? esc(s.task) + ' · ' + (s.endsAt > now() ? minsLeft(s) + ' min left' : "time's up") + (s.steps.length ? ' · step ' + Math.min(s.step + 1, s.steps.length) + '/' + s.steps.length : '') : 'Free';
    var pct = s ? Math.min(100, (now() - s.startedAt) / (s.endsAt - s.startedAt) * 100) : 0;
    return '<div class="person"><b>' + esc(label) + '</b><div class="st">' + st + '</div>' +
      (s ? '<div class="mini"><i style="width:' + pct + '%"></i></div>' : '') +
      (p.doneToday.length ? '<div class="dn">✅ ' + esc(p.doneToday.join(', ')) + '</div>' : '') + '</div>';
  }

  function render() {
    el('duo').innerHTML = personCard(me(), 'You') + personCard(them(), them().name || 'Your partner');
    var s = me().session;
    document.body.className = s && now() >= s.endsAt ? 'timesup' : '';
    keepAwake(!!s);
    el('view').innerHTML = s ? focusView(s) : plan ? planView() : pickView();
    el('laterCard').hidden = !!s || !state.later.length;
    el('later').innerHTML = state.later.map(function (l) {
      var who = l.who === state.you ? 'you' : (them().name || 'your partner');
      return '<li><span>' + esc(l.thing) + ' <span class="who">· ' + esc(who) + '</span></span><button class="x" type="button" data-clear="' + esc(l.id) + '" aria-label="Done">✓</button></li>';
    }).join('');
    tick();
  }

  function pickView() {
    return '<section class="card"><div class="label">Pick one job</div><div class="grid">' +
      state.chores.map(function (c, i) {
        return '<button class="job" type="button" data-job="' + i + '">' + esc(c.name) + '<small>' + c.minutes + ' min' + (c.usual ? ' · usually ' + c.usual : '') + '</small></button>';
      }).join('') + '</div></section>' +
      '<section class="card"><form id="custom" autocomplete="off"><input type="text" id="customText" placeholder="Something else, e.g. clean the oven" enterkeyhint="go" aria-label="Another job">' +
      '<button class="primary" type="submit">Plan</button></form><p class="note">' +
      (state.hasClaudeKey ? 'Claude times it and breaks it into steps.' : 'You set the time. (Add a Claude key on the food page and it will time it for you.)') + '</p></section>';
  }

  function planView() {
    return '<section class="card plan"><div class="label">Ready?</div><h2>' + esc(plan.name) + '</h2>' +
      '<div class="mins"><button class="soft" type="button" data-mins="-5" aria-label="5 minutes less">−5</button><span>' + plan.minutes + ' min</span><button class="soft" type="button" data-mins="5" aria-label="5 minutes more">+5</button></div>' +
      (plan.steps.length ? '<ol class="steps">' + plan.steps.map(function (st) { return '<li>' + esc(st) + '</li>'; }).join('') + '</ol>' : '') +
      '<button class="primary wide" type="button" id="go">Start ⏱ just this job</button>' +
      '<div class="center"><button class="ghost" type="button" id="back">Pick something else</button></div></section>';
  }

  function focusView(s) {
    var up = now() >= s.endsAt;
    var cur = s.steps[s.step];
    var started = now() - s.startedAt < 2 * 60000;
    return (up ? '<div class="up">⏰ Time\'s up for ' + esc(s.task) + '. Done? Or take 5 more and finish.</div>' : '') +
      '<section class="card focus"><div class="label">Only this</div><p class="task">' + esc(s.task) + '</p>' +
      '<div class="ringwrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bar)" stroke-width="10"/>' +
      '<circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--ring)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>' +
      '<div class="t"><div><span id="left">' + clock(s.endsAt - now()) + '</span><small id="leftLabel">' + (up ? 'over' : 'left') + '</small></div></div></div>' +
      (s.steps.length ? (cur ? '<div class="now"><div class="k">Now</div><div class="s">' + esc(cur) + '</div><button class="primary wide" type="button" data-step="' + s.step + '">✓ Step done</button></div>' : '<div class="now"><div class="s">All steps done 🎉</div></div>') +
        '<ul class="checks">' + s.steps.map(function (st, i) {
          return '<li class="' + (i < s.step ? 'done' : i === s.step ? 'cur' : '') + '" data-step="' + (i < s.step ? i - 1 : i) + '"><span class="box">' + (i < s.step ? '✓' : '') + '</span>' + esc(st) + '</li>';
        }).join('') + '</ul>' : '') +
      (parking ? '<form id="park" autocomplete="off" style="margin-bottom:10px"><input type="text" id="parkText" placeholder="What popped into your head?" aria-label="Thing to park"><button class="primary" type="submit">Park</button></form>' : '') +
      '<div class="row3"><button class="soft" type="button" id="parkBtn">🅿️ Park it</button><button class="soft" type="button" id="more">+5 min</button><button class="primary" type="button" id="done">✅ Done</button></div>' +
      '<div class="center"><button class="ghost" type="button" id="stop">Stop and park the rest</button>' +
      (started ? '<button class="ghost" type="button" id="cancel">Wrong job</button>' : '') + '</div>' +
      '<p class="note">Noticed something else that needs doing? Park it. Don\'t go and do it.</p></section>';
  }

  // Runs every second: countdown, ring, halfway and time's-up nudges.
  function tick() {
    var s = me().session;
    if (!s) return;
    var left = s.endsAt - now();
    var l = el('left');
    if (l) {
      l.textContent = clock(Math.abs(left));
      el('arc').setAttribute('stroke-dashoffset', left <= 0 ? '0' : String(326.7 * Math.min(1, Math.max(0, 1 - left / (s.endsAt - s.startedAt)))));
      el('arc').setAttribute('stroke', left <= 0 ? 'var(--amber-text)' : 'var(--ring)');
    }
    var id = s.startedAt + ':' + s.endsAt;
    if (left <= (s.endsAt - s.startedAt) / 2 && left > 0 && halfwayShown !== id && s.endsAt - s.startedAt >= 6 * 60000) {
      halfwayShown = id; chime(1); toast('Halfway. Still on ' + s.task + '? 👍');
    }
    if (left <= 0) {
      if (upShown !== id) { upShown = id; render(); }
      if (Math.floor(-left / 1000) % 60 === 0) chime(3);   // repeats each minute until you choose
    }
  }
  setInterval(function () { tick(); if (me().session) el('duo').innerHTML = personCard(me(), 'You') + personCard(them(), them().name || 'Your partner'); }, 1000);

  var toastTimer;
  function toast(msg, isErr) {
    var t = el('toast');
    t.textContent = msg;
    t.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = isErr ? 'err' : ''; }, isErr ? 6000 : 2800);
  }

  function call(fn, args, ok) {
    busy = true;
    var r = google.script.run
      .withSuccessHandler(function (res) { busy = false; ok(res); })
      .withFailureHandler(function (err) { busy = false; toast(err.message || String(err), true); render(); });
    r[fn].apply(r, [KEY].concat(args));
  }
  function apply(s, msg) { state = s; offset = s.now - Date.now(); render(); if (msg) toast(msg); }

  // ---- taps ----
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, li[data-step]');
    if (!t || busy) return;
    if (t.dataset.job) { var c = state.chores[Number(t.dataset.job)]; plan = { name: c.name, minutes: c.minutes, steps: c.steps.slice() }; render(); }
    else if (t.dataset.mins) { plan.minutes = Math.max(5, Math.min(180, plan.minutes + Number(t.dataset.mins))); render(); }
    else if (t.id === 'back') { plan = null; render(); }
    else if (t.id === 'go') { var p = plan; call('startChore', [p], function (s) { plan = null; apply(s, 'Go. Just ' + p.name + ' for ' + p.minutes + ' min.'); }); }
    else if (t.dataset.step !== undefined) { call('stepDone', [Number(t.dataset.step)], function (s) { apply(s); }); }
    else if (t.id === 'parkBtn') { parking = !parking; render(); if (parking) el('parkText').focus(); }
    else if (t.id === 'more') { call('extendChore', [5], function (s) { upShown = ''; apply(s, '+5 min. Finish it off.'); }); }
    else if (t.id === 'done') { var task = me().session.task; call('finishChore', ['Done'], function (s) { parking = false; apply(s, '✅ ' + task + ' done. Nice.'); }); }
    else if (t.id === 'stop') { call('finishChore', ['Stopped'], function (s) { parking = false; apply(s, 'Stopped. The rest is parked for later.'); }); }
    else if (t.id === 'cancel') { call('finishChore', ['Cancelled'], function (s) { parking = false; apply(s, 'Cancelled. Pick the right one.'); }); }
    else if (t.dataset.clear) { call('clearLater', [t.dataset.clear], function (s) { apply(s); }); }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (busy) return;
    if (ev.target.id === 'custom') {
      var text = el('customText').value.trim();
      if (!text) return;
      toast(state.hasClaudeKey ? 'Asking Claude how long that takes…' : 'Set the time, then start.');
      call('planChore', [text], function (p) { plan = p; render(); });
    }
    if (ev.target.id === 'park') {
      var v = el('parkText').value.trim();
      if (!v) return;
      var task = me().session.task;
      call('parkThing', [v], function (s) { parking = false; apply(s, 'Parked. Back to ' + task + '.'); });
    }
  });

  // See what your partner is up to: refresh every 20 s while the page is open.
  function refresh() { if (!busy && !parking && document.visibilityState === 'visible') call('choresState', [], function (s) { apply(s); }); }
  setInterval(refresh, 20000);
  document.addEventListener('visibilitychange', refresh);

  if (OTHER) { el('other').href = OTHER; el('other').hidden = false; }
  render();
</script>
</body>
</html>
